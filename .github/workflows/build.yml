name: Build JOE APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Generate JOE Logo, Splash Theme & Update Manifest
        run: |
          python3 - << 'EOF'
          import os
          import re
          import struct
          import zlib

          res_dirs = [
              "app/src/main/res/mipmap-mdpi",
              "app/src/main/res/mipmap-hdpi",
              "app/src/main/res/mipmap-xhdpi",
              "app/src/main/res/mipmap-xxhdpi",
              "app/src/main/res/mipmap-xxxhdpi",
              "app/src/main/res/drawable"
          ]

          # 5x7 piksel blok font (J, O, E harfleri)
          GLYPHS = {
              'J': [
                  "00111",
                  "00010",
                  "00010",
                  "00010",
                  "10010",
                  "10010",
                  "01100",
              ],
              'O': [
                  "01110",
                  "10001",
                  "10001",
                  "10001",
                  "10001",
                  "10001",
                  "01110",
              ],
              'E': [
                  "11111",
                  "10000",
                  "10000",
                  "11110",
                  "10000",
                  "10000",
                  "11111",
              ],
          }

          def write_png_rgba(path, width, height, pixels):
              def png_chunk(chunk_type, data):
                  crc = zlib.crc32(chunk_type + data) & 0xFFFFFFFF
                  return struct.pack("!I", len(data)) + chunk_type + data + struct.pack("!I", crc)

              raw = bytearray()
              for y in range(height):
                  raw.append(0)
                  row_start = y * width * 4
                  raw.extend(pixels[row_start:row_start + width * 4])

              ihdr = struct.pack("!IIBBBBB", width, height, 8, 6, 0, 0, 0)
              idat = zlib.compress(bytes(raw), level=6)
              png_bytes = (
                  b"\x89PNG\r\n\x1a\n"
                  + png_chunk(b"IHDR", ihdr)
                  + png_chunk(b"IDAT", idat)
                  + png_chunk(b"IEND", b"")
              )
              with open(path, "wb") as f:
                  f.write(png_bytes)

          def make_joe_icon(size):
              bg = (229, 9, 20, 255)      # Kırmızı tema (#E50914)
              fg = (255, 255, 255, 255)   # Beyaz JOE yazısı & çerçeve
              buf = bytearray(bg) * (size * size)

              def set_px(x, y, col):
                  if 0 <= x < size and 0 <= y < size:
                      idx = (y * size + x) * 4
                      buf[idx:idx + 4] = bytes(col)

              # Dış çerçeve
              border = max(2, size // 28)
              pad = max(4, size // 10)
              for t in range(border):
                  for x in range(pad, size - pad):
                      set_px(x, pad + t, fg)
                      set_px(x, size - pad - 1 - t, fg)
                  for y in range(pad, size - pad):
                      set_px(pad + t, y, fg)
                      set_px(size - pad - 1 - t, y, fg)

              # Ortada "JOE" çizimi
              word = "JOE"
              scale = max(2, size // 28)
              glyph_w = 5 * scale
              glyph_h = 7 * scale
              gap = max(2, scale)
              total_w = len(word) * glyph_w + (len(word) - 1) * gap
              start_x = (size - total_w) // 2
              start_y = (size - glyph_h) // 2

              for g_idx, ch in enumerate(word):
                  pattern = GLYPHS.get(ch, [])
                  gx0 = start_x + g_idx * (glyph_w + gap)
                  for r_idx, row in enumerate(pattern):
                      for c_idx, cell in enumerate(row):
                          if cell == "1":
                              px0 = gx0 + c_idx * scale
                              py0 = start_y + r_idx * scale
                              for dy in range(scale):
                                  for dx in range(scale):
                                      set_px(px0 + dx, py0 + dy, fg)

              return buf

          for d in res_dirs:
              os.makedirs(d, exist_ok=True)
              sz = 256 if d.endswith("drawable") else 192
              pixels = make_joe_icon(sz)
              for fname in ["ic_launcher.png", "ic_launcher_round.png", "joe_splash_logo.png"]:
                  write_png_rgba(os.path.join(d, fname), sz, sz, pixels)

          v31_dir = "app/src/main/res/values-v31"
          os.makedirs(v31_dir, exist_ok=True)
          with open(os.path.join(v31_dir, "styles.xml"), "w", encoding="utf-8") as f:
              f.write("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.JoeSplash" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowSplashScreenBackground">#140E0E</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@mipmap/ic_launcher</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">#E50914</item>
              </style>
          </resources>
          """)

          manifest_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as mf:
                  xml = mf.read()

              def patch_app_tag(m):
                  tag = m.group(0)
                  if "android:icon=" in tag:
                      tag = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"', tag)
                  else:
                      tag = tag.replace("<application", '<application android:icon="@mipmap/ic_launcher"', 1)
                  if "android:roundIcon=" in tag:
                      tag = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher_round"', tag)
                  else:
                      tag = tag.replace("<application", '<application android:roundIcon="@mipmap/ic_launcher_round"', 1)
                  if "android:label=" in tag:
                      tag = re.sub(r'android:label="[^"]*"', 'android:label="JOE"', tag)
                  else:
                      tag = tag.replace("<application", '<application android:label="JOE"', 1)
                  return tag

              xml = re.sub(r"<application\b[^>]*>", patch_app_tag, xml, count=1)

              def patch_main_activity(m):
                  tag = m.group(0)
                  if "android:theme=" in tag:
                      return re.sub(r'android:theme="[^"]*"', 'android:theme="@style/Theme.JoeSplash"', tag)
                  return tag.replace("<activity", '<activity android:theme="@style/Theme.JoeSplash"', 1)

              xml = re.sub(r"<activity\b[^>]*MainActivity[^>]*>", patch_main_activity, xml, count=1)

              with open(manifest_path, "w", encoding="utf-8") as mf:
                  mf.write(xml)
          EOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JOE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
