name: Build JOE APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Generate JOE Logo, Splash Theme & Update Manifest
        run: |
          python3 -c '
          from PIL import Image, ImageDraw, ImageFont
          import os, re

          res_dirs = [
              "app/src/main/res/mipmap-mdpi",
              "app/src/main/res/mipmap-hdpi",
              "app/src/main/res/mipmap-xhdpi",
              "app/src/main/res/mipmap-xxhdpi",
              "app/src/main/res/mipmap-xxxhdpi",
              "app/src/main/res/drawable"
          ]

          def make_joe_icon(size):
              img = Image.new("RGBA", (size, size), (229, 9, 20, 255))
              draw = ImageDraw.Draw(img)
              pad = int(size * 0.14)
              draw.rounded_rectangle(
                  [pad, int(size * 0.22), size - pad, int(size * 0.78)],
                  radius=max(8, int(size * 0.12)),
                  outline=(255, 255, 255, 255),
                  width=max(3, int(size * 0.04))
              )
              font_size = max(14, int(size * 0.25))
              font = None
              for fp in [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf"
              ]:
                  if os.path.exists(fp):
                      font = ImageFont.truetype(fp, font_size)
                      break
              if font is None:
                  font = ImageFont.load_default()
              text = "JOE"
              bbox = draw.textbbox((0, 0), text, font=font)
              tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
              draw.text(((size - tw) / 2, (size - th) / 2 - size * 0.02), text, fill=(255, 255, 255, 255), font=font)
              return img

          for d in res_dirs:
              os.makedirs(d, exist_ok=True)
              sz = 512 if d.endswith("drawable") else 192
              icon = make_joe_icon(sz)
              icon.save(os.path.join(d, "ic_launcher.png"))
              icon.save(os.path.join(d, "ic_launcher_round.png"))
              icon.save(os.path.join(d, "joe_splash_logo.png"))

          v31_dir = "app/src/main/res/values-v31"
          os.makedirs(v31_dir, exist_ok=True)
          with open(os.path.join(v31_dir, "styles.xml"), "w", encoding="utf-8") as f:
              f.write("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.JoeSplash" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowSplashScreenBackground">#140E0E</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@mipmap/ic_launcher</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">#E50914</item>
              </style>
          </resources>
          """)

          manifest_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as mf:
                  xml = mf.read()

              def patch_app_tag(m):
                  tag = m.group(0)
                  if "android:icon=" in tag:
                      tag = re.sub(r\x27android:icon="[^"]*"\x27, \x27android:icon="@mipmap/ic_launcher"\x27, tag)
                  else:
                      tag = tag.replace("<application", \x27<application android:icon="@mipmap/ic_launcher"\x27, 1)
                  if "android:roundIcon=" in tag:
                      tag = re.sub(r\x27android:roundIcon="[^"]*"\x27, \x27android:roundIcon="@mipmap/ic_launcher_round"\x27, tag)
                  else:
                      tag = tag.replace("<application", \x27<application android:roundIcon="@mipmap/ic_launcher_round"\x27, 1)
                  if "android:label=" in tag:
                      tag = re.sub(r\x27android:label="[^"]*"\x27, \x27android:label="JOE"\x27, tag)
                  else:
                      tag = tag.replace("<application", \x27<application android:label="JOE"\x27, 1)
                  return tag

              xml = re.sub(r"<application\b[^>]*>", patch_app_tag, xml, count=1)

              def patch_main_activity(m):
                  tag = m.group(0)
                  if "android:theme=" in tag:
                      return re.sub(r\x27android:theme="[^"]*"\x27, \x27android:theme="@style/Theme.JoeSplash"\x27, tag)
                  return tag.replace("<activity", \x27<activity android:theme="@style/Theme.JoeSplash"\x27, 1)

              xml = re.sub(r"<activity\b[^>]*MainActivity[^>]*>", patch_main_activity, xml, count=1)

              with open(manifest_path, "w", encoding="utf-8") as mf:
                  mf.write(xml)
          '

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JOE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
